[project]
name = "worlds-easiest-game"
version = "0.1.0"
description = "deps for running the game"
readme = "README.md"
authors = [
    { name = "imad-shah", email = "ishah5@student.gsu.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "pygame>=2.6.1",
]

[project.scripts]
worlds-easiest-game = "worlds_easiest_game:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# The game is imported from the installed `worlds_easiest_game` package, the
# same way the console script reaches it, so the suite needs no import root.
testpaths = ["tests"]
